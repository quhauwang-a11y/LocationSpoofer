name: Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install platform 37 (canary channel)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          [ -d "$SDK/platforms/android-37.0" ] && [ ! -e "$SDK/platforms/android-37" ] && ln -s android-37.0 "$SDK/platforms/android-37" || true
          ls -l "$SDK/platforms"

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGlobalDebug
          ./gradlew --no-daemon --stacktrace :app:assembleScopedDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocationSpoofer-debug
          path: app/build/outputs/apk/**/debug/*.apk
