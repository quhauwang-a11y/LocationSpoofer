name: Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 不用第三方 action，直接用 runner 预装的 SDK；只把 compileSdk 降到预装版本
      - name: Lower compileSdk to preinstalled platform
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 35/' app/build.gradle.kts app-ui/build.gradle.kts \
            core-data/build.gradle.kts service/build.gradle.kts xposed/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 35/' app/build.gradle.kts
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGlobalDebug
          ./gradlew --no-daemon --stacktrace :app:assembleScopedDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocationSpoofer-debug
          path: app/build/outputs/apk/**/debug/*.apk
