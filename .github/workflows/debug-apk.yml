name: Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Lower compileSdk for local SDK
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts app-ui/build.gradle.kts \
            core-data/build.gradle.kts service/build.gradle.kts xposed/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGlobalDebug
          ./gradlew --no-daemon --stacktrace :app:assembleScopedDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocationSpoofer-debug
          path: app/build/outputs/apk/**/debug/*.apk
