name: Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 仓库写的是 compileSdk 37，公共 SDK 源目前只有 36.x，这里在 CI 内降一级，仅影响本次构建
      - name: Lower compileSdk for local SDK
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts app-ui/build.gradle.kts \
            core-data/build.gradle.kts service/build.gradle.kts xposed/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleGlobalDebug
          ./gradlew --no-daemon :app:assembleScopedDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-debug
          path: app/build/outputs/apk/**/debug/*.apk
